<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf6ee">
  <title>拾遗 · 学习资料库</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='38' rx='24' ry='21' fill='%23fff6e6' stroke='%23ebd9bc' stroke-width='2'/%3E%3Cpath d='M32 20 C32 15 32 12 32 9' stroke='%235e8c61' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Cpath d='M32 14 C25 13 21 7 23 2 C31 4 34 10 32 14Z' fill='%237fa87a'/%3E%3Ccircle cx='25' cy='36' r='2.4' fill='%234a3f33'/%3E%3Ccircle cx='39' cy='36' r='2.4' fill='%234a3f33'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="mochi" viewBox="0 0 120 120" aria-hidden="true">
          <path d="M60 36 C60 28 60 22 60 16" stroke="#5E8C61" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M60 24 C49 22 42 13 45 5 C56 8 62 15 60 24Z" fill="#7FA87A"/>
          <path d="M60 24 C71 22 78 13 75 5 C64 8 58 15 60 24Z" fill="#9BC495"/>
          <ellipse cx="60" cy="76" rx="42" ry="38" fill="#FFF6E6" stroke="#EBD9BC" stroke-width="3"/>
          <circle cx="46" cy="72" r="4" fill="#4A3F33"/>
          <circle cx="74" cy="72" r="4" fill="#4A3F33"/>
          <circle cx="37" cy="84" r="5" fill="#F6C9B0" opacity=".7"/>
          <circle cx="83" cy="84" r="5" fill="#F6C9B0" opacity=".7"/>
          <path d="M53 84 C57 89 63 89 67 84" stroke="#4A3F33" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="brand-text">
          <h1>拾遗</h1>
        </div>
      </div>
      <div class="status" title="数据保存在本项目 data/seekdb 目录">
        <span>本地模式</span>
        <span class="status-addr">127.0.0.1:8001</span>
      </div>
    </header>

    <main class="layout">
      <aside class="side">
        <section class="card import-card" aria-labelledby="import-title">
          <div class="section-head">
            <h2 id="import-title">导入资料</h2>
          </div>

          <form id="import-form" class="import-form" novalidate>
            <div class="field">
              <label for="import-paths">目录或文件路径</label>
              <textarea id="import-paths" name="paths" rows="2" spellcheck="false" placeholder="sample_data">sample_data</textarea>
              <p class="hint">项目内相对路径，多个用逗号分隔；支持 md / txt / pdf。</p>
            </div>
            <div class="import-row">
              <div class="field field-grow">
                <label for="import-course">课程标签</label>
                <input id="import-course" name="course" type="text" value="db" maxlength="64" autocomplete="off" placeholder="例如 oceanbase">
              </div>
              <button id="import-submit" class="btn btn-primary" type="submit">导入</button>
            </div>
          </form>

          <div id="import-feedback" class="feedback" role="status" aria-live="polite" hidden></div>
          <ul id="import-files" class="file-list" hidden></ul>
        </section>

        <section class="card review-card" aria-labelledby="review-title">
          <div class="section-head review-head">
            <div>
              <h2 id="review-title">优先复习</h2>
            </div>
            <button id="review-refresh" class="refresh-btn" type="button" title="重新读取 PowerContext 记忆">刷新</button>
          </div>
          <div id="review-body" class="review-body" aria-live="polite">
            <div class="review-loading"><span class="spinner spinner-small" aria-hidden="true"></span>正在读取记忆…</div>
          </div>
        </section>
      </aside>

      <section class="card ask-card" aria-labelledby="ask-title">
        <div class="section-head ask-head">
          <div>
            <h2 id="ask-title">检索</h2>
          </div>
        </div>

        <form id="search-form" class="search-form" novalidate>
          <label class="sr-only" for="search-q">你的问题</label>
          <input id="search-q" class="query-input" name="q" type="text" autocomplete="off" placeholder="例如：为什么写多读少适合 LSM 结构？">
          <label class="sr-only" for="search-course">课程过滤</label>
          <input id="search-course" class="course-input" name="course" type="text" value="db" maxlength="64" autocomplete="off" placeholder="课程（留空为全部）">
          <button id="search-submit" class="btn btn-primary search-btn" type="submit">检索</button>
        </form>

        <div id="examples" class="examples" aria-label="示例问题">
          <button class="chip" type="button" data-query="写放大是什么">写放大是什么</button>
          <button class="chip" type="button" data-query="死锁怎么办">死锁怎么办</button>
          <button class="chip" type="button" data-query="为什么写多读少适合 LSM 结构">LSM 与写多读少</button>
        </div>

        <div class="result-meta-row">
          <span id="results-meta">语义 + 关键词 · RRF 融合</span>
        </div>

        <div id="results" class="results" aria-live="polite">
          <div class="state-card">
            <span class="state-mark" aria-hidden="true"><svg viewBox="0 0 120 120"><path d="M60 36 C60 28 60 22 60 16" stroke="#5E8C61" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M60 24 C49 22 42 13 45 5 C56 8 62 15 60 24Z" fill="#7FA87A"/><path d="M60 24 C71 22 78 13 75 5 C64 8 58 15 60 24Z" fill="#9BC495"/><ellipse cx="60" cy="76" rx="42" ry="38" fill="#FFF6E6" stroke="#EBD9BC" stroke-width="3"/><circle cx="46" cy="72" r="4" fill="#4A3F33"/><circle cx="74" cy="72" r="4" fill="#4A3F33"/><circle cx="37" cy="84" r="5" fill="#F6C9B0" opacity=".7"/><circle cx="83" cy="84" r="5" fill="#F6C9B0" opacity=".7"/><path d="M53 84 C57 89 63 89 67 84" stroke="#4A3F33" stroke-width="3" fill="none" stroke-linecap="round"/></svg></span>
            <p class="state-title">还没有结果</p>
            <p class="state-detail">先在左侧导入资料，或直接输入问题。</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>资料在 seekdb · 复习状态在 PowerContext</span>
      <span>单机单用户 · 本地运行</span>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
