[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coursecite"
version = "0.1.0"
description = "课引 CourseCite：课程资料混合检索 + 引用定位 + 检索留痕"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
live = ["pyseekdb>=1.4.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
coursecite = "coursecite.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
